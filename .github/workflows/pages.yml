name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deployment tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Deploy the new API before exposing a frontend that requires it. This
      # prevents a Pages-only release from locking every member at the gate.
      # Typechecking and tests are deliberately omitted for this release.
      - name: Deploy Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo '::error::Add the production CONVEX_DEPLOY_KEY repository secret before deploying this release. The existing live frontend has been preserved.'
            exit 1
          fi
          npx convex deploy --yes --typecheck disable --codegen disable
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stamp release and asset versions
        run: node scripts/stamp-release.mjs
      - name: Upload docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
