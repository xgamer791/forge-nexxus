# Forge Nexxus — sites router, the Nginx way.
#
# OPTIONAL. Only use this if the PHP router is not the right fit: it needs a
# server block of its own, which on Cloudways means root or a support ticket.
# `/home/master/applications/<app>/conf/server.nginx` is included *inside* the
# application's existing server block, so this file cannot simply be dropped
# there. The PHP router needs none of that, which is why it is the default.
#
# What this does instead of PHP: Nginx answers the wildcard hostname itself
# and proxies straight to the Convex deployment, which is one less moving part
# and noticeably faster, at the cost of being harder to install here.

server {
    listen 80;
    listen 443 ssl http2;
    server_name ~^(?<slug>[a-z0-9][a-z0-9-]{1,38}[a-z0-9])\.sites\.forgenexxus\.com$;

    # A wildcard certificate: see HOSTING.md for getting one with DNS-01.
    ssl_certificate     /etc/letsencrypt/live/sites.forgenexxus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sites.forgenexxus.com/privkey.pem;

    # Let Let's Encrypt renew without going through the proxy below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The upstream is named through a variable, so nginx looks it up when a
    # request arrives rather than once at start, and needs a resolver to do it.
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # A site has as many pages as it was built with, and the deployment is what
    # knows which: every address goes on to it, and one the site has no page at
    # comes back 404 with the deployment's own page. `$uri` is the path after
    # nginx has decoded it and resolved any `..`, so a crafted path cannot climb
    # out of this slug.
    location / {
        proxy_pass https://polished-ram-883.convex.site/sites/$slug$uri;
        proxy_ssl_server_name on;
        proxy_set_header Host polished-ram-883.convex.site;
        proxy_set_header Accept text/html;
        # Named the way the PHP router names itself, so the deployment leaves a
        # page's links as they are -- `/about` on this host -- rather than
        # pointing them under /sites/<slug> for a browser reading its origin.
        proxy_set_header User-Agent ForgeNexxus-SitesRouter/1.0;
        proxy_connect_timeout 5s;
        proxy_read_timeout 12s;
        # The visitor never needs to know where this came from.
        proxy_hide_header x-powered-by;
    }
}
